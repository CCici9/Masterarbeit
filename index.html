<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baukastentool für Zähler Skizzen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
  <style>
    :root {
      --hne-rot: #FF4C4C;
      --hne-dunkelblau: #012F60;
      --hne-weiss: #FFFFFF;
      --hne-leuchtgruen: #D3F622;
      --hne-leuchtblau: #0363FF;
      --hne-grau-100: #F6F5F2;
      --hne-grau-200: #EFEEEC;
      --hne-grau-300: #E3E2E0;
      --hne-grau-400: #D6D5D4;
      --hne-grau-500: #BDBCBA;
      --hne-grau-600: #A3A3A1;
      --hne-grau-700: #8A8988;
      --hne-grau-800: #70706F;
      --hne-grau-900: #626262;
      --hne-schwarz: #000000;
    }
  </style>
</head>
<body style="background-color: #F6F5F2; color: #012F60;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo } = React;

    // ============================================================================
    // Exakte Nennweiten-, Zähler- & Komponentendefinitionen
    // ============================================================================
    const DN_OPTIONS = [25, 50, 80, 100, 125, 150, 200, 250, 400];
    const G_SIZE_OPTIONS = ['G65', 'G100', 'G160', 'G250', 'G400', 'G650'];
    const METER_MODELS = ['Elster DKZ', 'Rabo', 'IRM-3 Duo', 'Sonstiges'];
    const NOZZLE_SIZES = ['1/2"', '1"', '3/4"'];

    const COMPONENT_CATALOG = [
      { typ: 'Armatur', label: 'Armatur', defaultLen: 0, inChain: false },
      { typ: 'Reduzierung', label: 'Reduzierung', defaultLen: 150, inChain: true },
      { typ: 'Kompensator', label: 'Kompensator', defaultLen: 150, inChain: true },
      { typ: 'Zähler', label: 'Zähler', defaultLen: 171, inChain: true },
      { typ: '90°-Bogen', label: '90°-Bogen', defaultLen: 200, inChain: true },
      { typ: 'Stahlrohr', label: 'Stahlrohr', defaultLen: 200, inChain: true }
    ];

    const DIR_VECTORS = {
      right: { dx: 1, dy: 0, label: 'Horizontal' },
      left: { dx: -1, dy: 0, label: 'Horizontal (←)' },
      up: { dx: 0, dy: -1, label: 'Vertikal (↑)' },
      down: { dx: 0, dy: 1, label: 'Vertikal (↓)' }
    };

    function getAvailableBendDirections(incomingDir) {
      if (incomingDir === 'right' || incomingDir === 'left') {
        return [
          { value: 'up', label: 'Nach oben (↑)' },
          { value: 'down', label: 'Nach unten (↓)' }
        ];
      }
      return [
        { value: 'right', label: 'Nach rechts (→)' },
        { value: 'left', label: 'Nach links (←)' }
      ];
    }

    function resolveBendOutDir(incomingDir, bendDir) {
      const valid = getAvailableBendDirections(incomingDir).map((d) => d.value);
      if (valid.includes(bendDir)) return bendDir;
      return valid[0];
    }

    function getPipeHalfHeight(dn) {
      const idx = DN_OPTIONS.indexOf(Number(dn));
      if (idx === -1) return 18;
      return 13 + idx * 2.5;
    }

    function getMeterDisplayLabel(item) {
      if (item.meterModel === 'Sonstiges') {
        return item.customMeterModel && item.customMeterModel.trim()
          ? item.customMeterModel.trim()
          : '';
      }
      return item.meterModel || '';
    }

    // ============================================================================
    // 2D-Pfad- & Bounding-Box-Berechnung für alle Bauteile
    // ============================================================================
    function compute2DLayout(items, startDir) {
      const STEP_LEN = 144;
      const BEND_ARM = 72;

      let curX = 0;
      let curY = 0;
      let curDir = startDir;

      const nodes = items.map((item, idx) => {
        const inDir = curDir;
        const inVec = DIR_VECTORS[inDir];

        if (item.typ === '90°-Bogen') {
          const outDir = resolveBendOutDir(inDir, item.bendDir);
          const outVec = DIR_VECTORS[outDir];

          const pIn = { x: curX, y: curY };
          const pCorner = {
            x: curX + inVec.dx * BEND_ARM,
            y: curY + inVec.dy * BEND_ARM
          };
          const pOut = {
            x: pCorner.x + outVec.dx * BEND_ARM,
            y: pCorner.y + outVec.dy * BEND_ARM
          };

          curX = pOut.x;
          curY = pOut.y;
          curDir = outDir;

          return {
            item,
            idx,
            isBend: true,
            inDir,
            outDir,
            pIn,
            pCorner,
            pOut,
            center: pCorner
          };
        } else {
          const pIn = { x: curX, y: curY };
          const pOut = {
            x: curX + inVec.dx * STEP_LEN,
            y: curY + inVec.dy * STEP_LEN
          };
          const center = {
            x: (pIn.x + pOut.x) / 2,
            y: (pIn.y + pOut.y) / 2
          };

          curX = pOut.x;
          curY = pOut.y;

          return {
            item,
            idx,
            isBend: false,
            inDir,
            outDir: inDir,
            pIn,
            pOut,
            center
          };
        }
      });

      let minX = -90;
      let maxX = 90;
      let minY = -90;
      let maxY = 90;

      if (nodes.length > 0) {
        minX = Infinity;
        maxX = -Infinity;
        minY = Infinity;
        maxY = -Infinity;

        nodes.forEach((n) => {
          const pts = n.isBend ? [n.pIn, n.pCorner, n.pOut] : [n.pIn, n.pOut];
          pts.forEach((pt) => {
            minX = Math.min(minX, pt.x - 130);
            maxX = Math.max(maxX, pt.x + 140);
            minY = Math.min(minY, pt.y - 115);
            maxY = Math.max(maxY, pt.y + 115);
          });
        });
      }

      return {
        nodes,
        startPoint: { x: 0, y: 0, dir: startDir },
        endPoint: { x: curX, y: curY, dir: curDir },
        bounds: { minX, maxX, minY, maxY }
      };
    }

    // ============================================================================
    // 2D-Bauteil-Renderer
    // ============================================================================
    function SchematicNode({ node, isSelected, onSelect }) {
      const { item, isBend, inDir, outDir, pIn, pCorner, pOut, center } = node;
      const h1 = getPipeHalfHeight(item.dnIn);
      const h2 = getPipeHalfHeight(item.dnOut);
      const hasNozzle = item.typ === 'Stahlrohr' && Boolean(item.hasNozzle);
      const nozzleSize = item.nozzleSize || '1"';

      if (isBend) {
        const inVec = DIR_VECTORS[inDir];
        const outVec = DIR_VECTORS[outDir];
        const angleIn = inDir === 'right' ? 0 : inDir === 'down' ? 90 : inDir === 'left' ? 180 : -90;
        const angleOut = outDir === 'right' ? 0 : outDir === 'down' ? 90 : outDir === 'left' ? 180 : -90;

        const nIn = { x: -inVec.dy, y: inVec.dx };
        const nOut = { x: -outVec.dy, y: outVec.dx };
        const dot = nIn.x * outVec.dx + nIn.y * outVec.dy;
        const sign = dot >= 0 ? 1 : -1;

        const p1A = { x: pIn.x + nIn.x * h1 * sign, y: pIn.y + nIn.y * h1 * sign };
        const p1B = { x: pIn.x - nIn.x * h1 * sign, y: pIn.y - nIn.y * h1 * sign };
        const p2A = { x: pOut.x + nOut.x * h1 * sign, y: pOut.y + nOut.y * h1 * sign };
        const p2B = { x: pOut.x - nOut.x * h1 * sign, y: pOut.y - nOut.y * h1 * sign };

        const cA = {
          x: pCorner.x + (nIn.x * sign + nOut.x * sign) * h1 * 0.55,
          y: pCorner.y + (nIn.y * sign + nOut.y * sign) * h1 * 0.55
        };
        const cB = {
          x: pCorner.x - (nIn.x * sign + nOut.x * sign) * h1 * 0.55,
          y: pCorner.y - (nIn.y * sign + nOut.y * sign) * h1 * 0.55
        };

        const labelOffsetX = (-inVec.dx - outVec.dx) * 38;
        const labelOffsetY = (-inVec.dy - outVec.dy) * 38;

        return (
          <g onClick={onSelect} className="cursor-pointer">
            {isSelected && (
              <circle
                cx={pCorner.x}
                cy={pCorner.y}
                r={62}
                fill="rgba(255, 76, 76, 0.14)"
                stroke="#FF4C4C"
                strokeWidth={2.5}
                strokeDasharray="6 3"
              />
            )}

            <path
              d={`M ${p1A.x} ${p1A.y} Q ${cA.x} ${cA.y} ${p2A.x} ${p2A.y} L ${p2B.x} ${p2B.y} Q ${cB.x} ${cB.y} ${p1B.x} ${p1B.y} Z`}
              fill="#FFFFFF"
              stroke="#012F60"
              strokeWidth={2}
            />

            <path
              d={`M ${pIn.x} ${pIn.y} Q ${pCorner.x} ${pCorner.y} ${pOut.x} ${pOut.y}`}
              fill="none"
              stroke="#8A8988"
              strokeWidth={1.2}
              strokeDasharray="4 3"
            />

            <g transform={`translate(${pIn.x}, ${pIn.y}) rotate(${angleIn})`}>
              <rect
                x={0}
                y={-h1 - 10}
                width={7}
                height={(h1 + 10) * 2}
                fill="#E3E2E0"
                stroke="#012F60"
                strokeWidth={1.8}
              />
            </g>

            <g transform={`translate(${pOut.x}, ${pOut.y}) rotate(${angleOut})`}>
              <rect
                x={-7}
                y={-h1 - 10}
                width={7}
                height={(h1 + 10) * 2}
                fill="#E3E2E0"
                stroke="#012F60"
                strokeWidth={1.8}
              />
            </g>

            <g transform={`translate(${pCorner.x + labelOffsetX}, ${pCorner.y + labelOffsetY})`}>
              <rect x={-66} y={-22} width={132} height={42} rx={6} fill="#FFFFFF" stroke="#012F60" strokeWidth={1.4} />
              <text x={0} y={-5} fontSize={11.5} fontWeight="bold" fill="#012F60" textAnchor="middle">
                90°-Bogen DN{item.dnIn}
              </text>
              {item.inChain && (
                <text x={0} y={13} fontSize={12} fontWeight="bold" fill="#FF4C4C" textAnchor="middle">
                  {item.length} mm
                </text>
              )}
            </g>
          </g>
        );
      }

      const isVerticalSeg = inDir === 'up' || inDir === 'down';
      const angle = inDir === 'right' ? 0 : inDir === 'down' ? 90 : inDir === 'left' ? 180 : -90;
      const w = 144;
      const halfW = w / 2;

      const dimOffset = isVerticalSeg ? 76 : 70;
      const labelOffset = isVerticalSeg ? -64 : (hasNozzle ? -72 : -58);

      return (
        <g onClick={onSelect} className="cursor-pointer">
          <g transform={`translate(${center.x}, ${center.y}) rotate(${angle})`}>
            {isSelected && (
              <rect
                x={-halfW + 2}
                y={hasNozzle ? -58 : -48}
                width={w - 4}
                height={hasNozzle ? 106 : 96}
                rx={8}
                fill="rgba(255, 76, 76, 0.14)"
                stroke="#FF4C4C"
                strokeWidth={2.5}
                strokeDasharray="6 3"
              />
            )}

            <rect
              x={-halfW}
              y={-h1 - 10}
              width={7}
              height={(h1 + 10) * 2}
              fill="#E3E2E0"
              stroke="#012F60"
              strokeWidth={1.8}
            />

            <rect
              x={halfW - 7}
              y={-h2 - 10}
              width={7}
              height={(h2 + 10) * 2}
              fill="#E3E2E0"
              stroke="#012F60"
              strokeWidth={1.8}
            />

            {item.typ === 'Armatur' && (
              <g>
                <polygon
                  points={`${-halfW + 9},-22 0,0 ${-halfW + 9},22`}
                  fill="#EFEEEC"
                  stroke="#012F60"
                  strokeWidth={2}
                />
                <polygon
                  points={`${halfW - 9},-22 0,0 ${halfW - 9},22`}
                  fill="#EFEEEC"
                  stroke="#012F60"
                  strokeWidth={2}
                />
                <circle cx={0} cy={0} r={8} fill="#FFFFFF" stroke="#012F60" strokeWidth={2} />
              </g>
            )}

            {item.typ === 'Reduzierung' && (
              <polygon
                points={`${-halfW + 7},${-h1} ${halfW - 7},${-h2} ${halfW - 7},${h2} ${-halfW + 7},${h1}`}
                fill="#FFFFFF"
                stroke="#012F60"
                strokeWidth={2}
              />
            )}

            {item.typ === 'Kompensator' && (
              <g>
                <rect
                  x={-halfW + 8}
                  y={-h1}
                  width={w - 16}
                  height={h1 * 2}
                  fill="#F6F5F2"
                  stroke="#012F60"
                  strokeWidth={1.8}
                />
                {[-38, -19, 0, 19, 38].map((wx) => (
                  <line
                    key={wx}
                    x1={wx}
                    y1={-h1 - 7}
                    x2={wx}
                    y2={h1 + 7}
                    stroke="#0363FF"
                    strokeWidth={2.5}
                  />
                ))}
              </g>
            )}

            {item.typ === 'Zähler' && (
              <rect
                x={-halfW + 10}
                y={-34}
                width={w - 20}
                height={68}
                rx={6}
                fill="#FFFFFF"
                stroke="#0363FF"
                strokeWidth={2.4}
              />
            )}

            {item.typ === 'Stahlrohr' && (
              <g>
                <rect
                  x={-halfW + 7}
                  y={-h1}
                  width={w - 14}
                  height={h1 * 2}
                  fill="#FFFFFF"
                  stroke="#012F60"
                  strokeWidth={2}
                />
                {hasNozzle && (
                  <g>
                    <rect
                      x={-7}
                      y={-h1 - 18}
                      width={14}
                      height={18}
                      fill="#FFFFFF"
                      stroke="#012F60"
                      strokeWidth={1.8}
                    />
                    <line
                      x1={-11}
                      y1={-h1 - 18}
                      x2={11}
                      y2={-h1 - 18}
                      stroke="#012F60"
                      strokeWidth={2.2}
                    />
                  </g>
                )}
              </g>
            )}
          </g>

          {item.typ === 'Zähler' ? (
            <g transform={`translate(${center.x}, ${center.y})`}>
              {getMeterDisplayLabel(item) && (
                <text x={0} y={-11} fontSize={11} fontWeight="bold" fill="#0363FF" textAnchor="middle">
                  {getMeterDisplayLabel(item)}
                </text>
              )}
              <text x={0} y={6} fontSize={14} fontWeight="bold" fill="#012F60" textAnchor="middle">
                {item.gSize || 'G100'}
              </text>
              <text x={0} y={22} fontSize={11} fontWeight="bold" fill="#626262" textAnchor="middle">
                DN {item.dnIn} • PN{item.pn}
              </text>
            </g>
          ) : (
            <g
              transform={
                isVerticalSeg
                  ? `translate(${center.x + labelOffset}, ${center.y})`
                  : `translate(${center.x}, ${center.y + labelOffset})`
              }
            >
              <text
                x={0}
                y={0}
                fontSize={12}
                fontWeight="bold"
                fill="#012F60"
                textAnchor={isVerticalSeg ? 'end' : 'middle'}
              >
                {item.typ === 'Reduzierung'
                  ? `Reduzierung ${item.dnIn}/${item.dnOut} (PN${item.pn})`
                  : `${item.typ} DN${item.dnIn} (PN${item.pn})`}
              </text>
              {hasNozzle && (
                <text
                  x={0}
                  y={15}
                  fontSize={11}
                  fontWeight="bold"
                  fill="#012F60"
                  textAnchor={isVerticalSeg ? 'end' : 'middle'}
                >
                  Stutzen {nozzleSize}
                </text>
              )}
            </g>
          )}

          {item.inChain && !isVerticalSeg && (
            <g>
              <line
                x1={pIn.x}
                y1={center.y + 38}
                x2={pIn.x}
                y2={center.y + dimOffset + 6}
                stroke="#8A8988"
                strokeWidth={1.4}
              />
              <line
                x1={pOut.x}
                y1={center.y + 38}
                x2={pOut.x}
                y2={center.y + dimOffset + 6}
                stroke="#8A8988"
                strokeWidth={1.4}
              />
              <line
                x1={Math.min(pIn.x, pOut.x) + 3}
                y1={center.y + dimOffset}
                x2={Math.max(pIn.x, pOut.x) - 3}
                y2={center.y + dimOffset}
                stroke="#012F60"
                strokeWidth={1.6}
                markerStart="url(#arrowStart)"
                markerEnd="url(#arrowEnd)"
              />
              <text
                x={center.x}
                y={center.y + dimOffset - 8}
                fontSize={13.5}
                fontWeight="bold"
                fill="#012F60"
                textAnchor="middle"
              >
                {item.length} mm
              </text>
            </g>
          )}

          {item.inChain && isVerticalSeg && (
            <g>
              <line
                x1={center.x + 38}
                y1={pIn.y}
                x2={center.x + dimOffset + 6}
                y2={pIn.y}
                stroke="#8A8988"
                strokeWidth={1.4}
              />
              <line
                x1={center.x + 38}
                y1={pOut.y}
                x2={center.x + dimOffset + 6}
                y2={pOut.y}
                stroke="#8A8988"
                strokeWidth={1.4}
              />
              <line
                x1={center.x + dimOffset}
                y1={Math.min(pIn.y, pOut.y) + 3}
                x2={center.x + dimOffset}
                y2={Math.max(pIn.y, pOut.y) - 3}
                stroke="#012F60"
                strokeWidth={1.6}
                markerStart="url(#arrowStart)"
                markerEnd="url(#arrowEnd)"
              />
              <text
                x={center.x + dimOffset + 9}
                y={center.y + 5}
                fontSize={13.5}
                fontWeight="bold"
                fill="#012F60"
                textAnchor="start"
              >
                {item.length} mm
              </text>
            </g>
          )}
        </g>
      );
    }

    // ============================================================================
    // Live-2D-Zeichenfläche
    // ============================================================================
    function Live2DSchematicCanvas({
      svgRef,
      positionNumber,
      startDir,
      dichtflaeche,
      items,
      totalLength,
      selectedId,
      onSelect,
      zoomLevel
    }) {
      const layout = useMemo(() => compute2DLayout(items, startDir), [items, startDir]);
      const { nodes, startPoint, endPoint, bounds } = layout;

      const headerSpace = 80;
      const contentW = Math.max(460, bounds.maxX - bounds.minX + 44);
      const contentH = Math.max(250, bounds.maxY - bounds.minY + 36);
      const svgW = contentW;
      const svgH = contentH + headerSpace;

      const offsetX = (svgW - (bounds.maxX - bounds.minX)) / 2 - bounds.minX;
      const offsetY = headerSpace + (contentH - (bounds.maxY - bounds.minY)) / 2 - bounds.minY;

      const startVec = DIR_VECTORS[startPoint.dir];
      const endVec = DIR_VECTORS[endPoint.dir];
      const isZoomed = zoomLevel > 1;

      return (
        <div
          className={`w-full rounded-2xl shadow-sm ${
            isZoomed ? 'overflow-auto max-h-[62vh]' : 'overflow-hidden'
          }`}
          style={{ backgroundColor: '#FFFFFF', border: '2px solid #012F60' }}
        >
          <svg
            ref={svgRef}
            xmlns="http://www.w3.org/2000/svg"
            viewBox={`0 0 ${svgW} ${svgH}`}
            preserveAspectRatio="xMidYMid meet"
            style={{
              fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
              width: isZoomed ? `${Math.round(zoomLevel * 100)}%` : '100%'
            }}
            className={`h-auto block select-none ${
              isZoomed ? 'max-w-none' : 'w-full max-h-[55vh] sm:max-h-[490px]'
            }`}
          >
            <defs>
              <pattern id="techGrid2D" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EFEEEC" strokeWidth="1" />
              </pattern>
              <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
                <path d="M 8 1 L 1 4 L 8 7 Z" fill="#012F60" />
              </marker>
              <marker id="arrowEnd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 1 1 L 7 4 L 1 7 Z" fill="#012F60" />
              </marker>
              <marker id="flowHead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
                <path d="M 1 1 L 8 4.5 L 1 8 Z" fill="#0363FF" />
              </marker>
            </defs>

            <rect width={svgW} height={svgH} fill="#FFFFFF" />
            <rect width={svgW} height={svgH} fill="url(#techGrid2D)" />

            <g transform="translate(14, 12)">
              <rect width={Math.min(430, svgW - 28)} height="52" rx="6" fill="#012F60" />
              <text x="12" y="23" fontSize="14.5" fontWeight="bold" fill="#D3F622">
                POS {positionNumber ? positionNumber : '—'} • {DIR_VECTORS[startDir]?.label}
              </text>
              <text x="12" y="42" fontSize="11.5" fill="#FFFFFF">
                {dichtflaeche ? 'Maße von Dichtfläche' : 'Maßbezug: Allgemein'} | Gesamt: {totalLength} mm
              </text>
            </g>

            {nodes.length === 0 ? (
              <g>
                <text
                  x={svgW / 2}
                  y={headerSpace + contentH / 2 - 8}
                  fontSize="15"
                  fontWeight="bold"
                  fill="#012F60"
                  textAnchor="middle"
                >
                  Tippe unten auf ein Bauteil, um zu starten
                </text>
                <text
                  x={svgW / 2}
                  y={headerSpace + contentH / 2 + 16}
                  fontSize="12"
                  fill="#70706F"
                  textAnchor="middle"
                >
                  Skizze passt sich automatisch an dein Display an
                </text>
              </g>
            ) : (
              <g transform={`translate(${offsetX}, ${offsetY})`}>
                <line
                  x1={startPoint.x - startVec.dx * 44}
                  y1={startPoint.y - startVec.dy * 44}
                  x2={startPoint.x}
                  y2={startPoint.y}
                  stroke="#012F60"
                  strokeWidth={3.5}
                />
                <line
                  x1={startPoint.x - startVec.dx * 40}
                  y1={startPoint.y - startVec.dy * 40}
                  x2={startPoint.x - startVec.dx * 12}
                  y2={startPoint.y - startVec.dy * 12}
                  stroke="#0363FF"
                  strokeWidth={3}
                  markerEnd="url(#flowHead)"
                />

                <line
                  x1={endPoint.x}
                  y1={endPoint.y}
                  x2={endPoint.x + endVec.dx * 44}
                  y2={endPoint.y + endVec.dy * 44}
                  stroke="#012F60"
                  strokeWidth={3.5}
                />

                {nodes.map((node) => (
                  <SchematicNode
                    key={node.item.id}
                    node={node}
                    isSelected={node.item.id === selectedId}
                    onSelect={() => onSelect(node.item.id)}
                  />
                ))}
              </g>
            )}
          </svg>
        </div>
      );
    }

    // ============================================================================
    // Hauptkomponente: Baukastentool für Zähler Skizzen
    // ============================================================================
    function App() {
      const svgRef = useRef(null);

      const urlContext = useMemo(() => {
        if (typeof window === 'undefined') return { pos: null, source: null };
        const params = new URLSearchParams(window.location.search);
        return {
          pos: params.get('pos'),
          source: params.get('source')
        };
      }, []);

      const [positionNumber, setPositionNumber] = useState('');
      const [startDir, setStartDir] = useState('right');
      const [dichtflaeche, setDichtflaeche] = useState(true);
      const [items, setItems] = useState([]);
      const [selectedId, setSelectedId] = useState(null);
      const [zoomLevel, setZoomLevel] = useState(1);

      useEffect(() => {
        if (urlContext.pos) {
          const digitsOnly = urlContext.pos.replace(/\D+/g, '');
          if (digitsOnly) {
            setPositionNumber(digitsOnly);
          }
        }
      }, [urlContext.pos]);

      const totalLength = useMemo(
        () => items.reduce((sum, it) => (it.inChain ? sum + (Number(it.length) || 0) : sum), 0),
        [items]
      );

      const itemDirections = useMemo(() => {
        let dir = startDir;
        return items.map((it) => {
          const inDir = dir;
          if (it.typ === '90°-Bogen') {
            dir = resolveBendOutDir(inDir, it.bendDir);
          }
          return { id: it.id, inDir, outDir: dir };
        });
      }, [items, startDir]);

      const handleAddItem = (template) => {
        const prev = items[items.length - 1];
        const inheritedDn = prev ? Number(prev.dnOut) : 100;
        const inheritedPn = prev ? Number(prev.pn) : 16;
        const currentOutDir =
          itemDirections.length > 0 ? itemDirections[itemDirections.length - 1].outDir : startDir;

        const defaultBendDir =
          currentOutDir === 'right' || currentOutDir === 'left' ? 'up' : 'right';

        const newId = `el_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`;
        const newItem = {
          id: newId,
          typ: template.typ,
          dnIn: inheritedDn,
          dnOut: inheritedDn,
          pn: inheritedPn,
          length: template.defaultLen,
          gSize: template.typ === 'Zähler' ? 'G100' : '',
          meterModel: template.typ === 'Zähler' ? 'Elster DKZ' : '',
          customMeterModel: '',
          bendDir: template.typ === '90°-Bogen' ? defaultBendDir : null,
          hasNozzle: false,
          nozzleSize: '1"',
          inChain: template.inChain
        };

        setItems((curr) => [...curr, newItem]);
        setSelectedId(newId);
      };

      const handleUpdateItem = (id, patch) => {
        setItems((curr) => {
          const idx = curr.findIndex((it) => it.id === id);
          if (idx === -1) return curr;

          const currentItem = curr[idx];
          const updatedItem = { ...currentItem, ...patch };
          const next = [...curr];
          next[idx] = updatedItem;

          if (updatedItem.typ === 'Reduzierung') {
            if (patch.dnIn !== undefined && idx > 0) {
              const newInDn = Number(patch.dnIn);
              const prevItem = next[idx - 1];
              next[idx - 1] = {
                ...prevItem,
                dnOut: newInDn,
                dnIn: prevItem.typ === 'Reduzierung' ? prevItem.dnIn : newInDn
              };
            }
            if (patch.dnOut !== undefined && idx < next.length - 1) {
              const newOutDn = Number(patch.dnOut);
              const nextItem = next[idx + 1];
              next[idx + 1] = {
                ...nextItem,
                dnIn: newOutDn,
                dnOut: nextItem.typ === 'Reduzierung' ? nextItem.dnOut : newOutDn
              };
            }
          }

          return next;
        });
      };

      const handleMoveItem = (index, dir) => {
        const target = index + dir;
        if (target < 0 || target >= items.length) return;
        const copy = [...items];
        const [moved] = copy.splice(index, 1);
        copy.splice(target, 0, moved);
        setItems(copy);
      };

      const handleRemoveItem = (id) => {
        setItems((curr) => {
          const next = curr.filter((it) => it.id !== id);
          if (selectedId === id) {
            setSelectedId(next[next.length - 1]?.id || null);
          }
          return next;
        });
      };

      const handleResetAll = () => {
        setItems([]);
        setSelectedId(null);
        setZoomLevel(1);
      };

      const handleExportPng = () => {
        const svgEl = svgRef.current;
        if (!svgEl) return;

        const serializer = new XMLSerializer();
        const svgString = serializer.serializeToString(svgEl);
        const vb = svgEl.viewBox.baseVal;
        const width = vb && vb.width ? vb.width : 800;
        const height = vb && vb.height ? vb.height : 380;

        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = width * scale;
        canvas.height = height * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        const img = new Image();
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = () => {
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);

          const pngUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          const safeNum = positionNumber ? positionNumber.replace(/[^0-9]+/g, '') : 'Unbenannt';
          link.download = `Skizze_POS_${safeNum}.png`;
          link.href = pngUrl;
          link.click();
        };
        img.src = url;
      };

      const selectedItem = items.find((it) => it.id === selectedId) || null;
      const selectedDirInfo = itemDirections.find((d) => d.id === selectedId) || null;

      return (
        <div className="min-h-screen flex flex-col" style={{ backgroundColor: '#F6F5F2', color: '#012F60' }}>
          <header className="text-white shadow" style={{ backgroundColor: '#012F60', borderBottom: '4px solid #FF4C4C' }}>
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div
                  className="w-9 h-9 rounded-lg flex items-center justify-center font-black shrink-0"
                  style={{ backgroundColor: '#FF4C4C', color: '#FFFFFF' }}
                >
                  ⚙
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-extrabold text-base tracking-tight text-white">
                      Baukastentool für Zähler Skizzen
                    </h1>
                    {urlContext.source && (
                      <span
                        className="px-2 py-0.5 text-[11px] font-bold uppercase rounded"
                        style={{ backgroundColor: '#0363FF', color: '#FFFFFF' }}
                      >
                        via {urlContext.source}
                      </span>
                    )}
                  </div>
                  <p className="text-[11px]" style={{ color: '#E3E2E0' }}>
                    Bauteile antippen • 90°-Bögen abwinkeln • Skizze als PNG speichern
                  </p>
                </div>
              </div>

              <button
                type="button"
                onClick={handleResetAll}
                className="px-3.5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition"
                style={{ backgroundColor: '#FFFFFF', color: '#012F60', border: '1px solid #D6D5D4' }}
              >
                ↺ Leeren / Neu starten
              </button>
            </div>

            <div className="px-4 py-2.5" style={{ backgroundColor: '#012F60', borderTop: '1px solid rgba(255,255,255,0.16)' }}>
              <div className="max-w-6xl mx-auto flex flex-wrap items-center gap-3">
                <div
                  className="flex items-center gap-2 px-3 py-2 rounded-xl"
                  style={{ backgroundColor: '#FFFFFF', border: '1px solid #D6D5D4' }}
                >
                  <span className="text-xs font-black tracking-wide select-none" style={{ color: '#626262' }}>POS</span>
                  <input
                    type="text"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    value={positionNumber}
                    onChange={(e) => setPositionNumber(e.target.value.replace(/\D+/g, ''))}
                    className="w-16 bg-transparent font-mono font-extrabold text-sm focus:outline-none"
                    style={{ color: '#012F60' }}
                    placeholder="Nr."
                    aria-label="Positionsnummer"
                  />
                </div>

                <div className="flex items-center p-1 rounded-xl" style={{ backgroundColor: '#FFFFFF', border: '1px solid #D6D5D4' }}>
                  <span className="text-[11px] font-bold px-2 hidden sm:inline" style={{ color: '#626262' }}>Lage:</span>
                  {[
                    { id: 'right', label: 'Horizontal' },
                    { id: 'down', label: 'Vertikal (↓)' },
                    { id: 'up', label: 'Vertikal (↑)' }
                  ].map((opt) => (
                    <button
                      key={opt.id}
                      type="button"
                      onClick={() => setStartDir(opt.id)}
                      className="px-3 py-1.5 rounded-lg text-xs font-bold transition"
                      style={
                        startDir === opt.id
                          ? { backgroundColor: '#0363FF', color: '#FFFFFF' }
                          : { backgroundColor: 'transparent', color: '#012F60' }
                      }
                    >
                      {opt.label}
                    </button>
                  ))}
                </div>

                <button
                  type="button"
                  onClick={() => setDichtflaeche(!dichtflaeche)}
                  className="px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition"
                  style={
                    dichtflaeche
                      ? { backgroundColor: '#D3F622', color: '#012F60', border: '1px solid #012F60' }
                      : { backgroundColor: '#FFFFFF', color: '#626262', border: '1px solid #D6D5D4' }
                  }
                >
                  <span>{dichtflaeche ? '✓' : '○'}</span>
                  Maße von Dichtfläche
                </button>

                <div
                  className="ml-auto flex items-center gap-1.5 px-3 py-2 rounded-xl"
                  style={{ backgroundColor: '#FFFFFF', border: '1px solid #D6D5D4' }}
                >
                  <span className="text-xs" style={{ color: '#626262' }}>Gesamt:</span>
                  <span className="font-mono font-extrabold text-sm" style={{ color: '#012F60' }}>{totalLength} mm</span>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-5 space-y-4 sm:space-y-5">
            <section className="space-y-2">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <span className="text-xs font-extrabold uppercase tracking-wider" style={{ color: '#012F60' }}>
                  Live-Skizze ({items.length} {items.length === 1 ? 'Teil' : 'Teile'})
                </span>

                <div
                  className="flex items-center gap-1 rounded-xl p-1 shadow-xs"
                  style={{ backgroundColor: '#FFFFFF', border: '1px solid #D6D5D4' }}
                >
                  <button
                    type="button"
                    onClick={() => setZoomLevel((z) => Math.max(1, Number((z - 0.35).toFixed(2))))}
                    disabled={zoomLevel <= 1}
                    className="px-2.5 py-1.5 rounded-lg text-xs font-bold disabled:opacity-30"
                    style={{ color: '#012F60' }}
                    title="Verkleinern"
                  >
                    −
                  </button>
                  <button
                    type="button"
                    onClick={() => setZoomLevel(1)}
                    className="px-2.5 py-1.5 rounded-lg text-xs font-extrabold transition"
                    style={
                      zoomLevel === 1
                        ? { backgroundColor: '#012F60', color: '#D3F622' }
                        : { backgroundColor: '#EFEEEC', color: '#012F60' }
                    }
                    title="Auf Bildschirmbreite einpassen"
                  >
                    {Math.round(zoomLevel * 100)}%
                  </button>
                  <button
                    type="button"
                    onClick={() => setZoomLevel((z) => Math.min(2.4, Number((z + 0.35).toFixed(2))))}
                    disabled={zoomLevel >= 2.4}
                    className="px-2.5 py-1.5 rounded-lg text-xs font-bold disabled:opacity-30"
                    style={{ color: '#012F60' }}
                    title="Vergrößern"
                  >
                    +
                  </button>
                </div>
              </div>

              <Live2DSchematicCanvas
                svgRef={svgRef}
                positionNumber={positionNumber}
                startDir={startDir}
                dichtflaeche={dichtflaeche}
                items={items}
                totalLength={totalLength}
                selectedId={selectedId}
                onSelect={setSelectedId}
                zoomLevel={zoomLevel}
              />

              <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                <span className="text-xs" style={{ color: '#626262' }}>
                  {items.length > 0
                    ? 'Tippe auf ein Bauteil in der Skizze, um es unten zu bearbeiten.'
                    : 'Wähle unten ein Bauteil aus, um deine Skizze aufzubauen.'}
                </span>

                <button
                  type="button"
                  onClick={handleExportPng}
                  disabled={items.length === 0}
                  className="px-4 py-2.5 rounded-xl font-extrabold text-xs sm:text-sm shadow transition disabled:opacity-40"
                  style={{ backgroundColor: '#FF4C4C', color: '#FFFFFF' }}
                >
                  PNG speichern
                </button>
              </div>
            </section>

            <section
              className="rounded-2xl p-3.5 sm:p-4 shadow-xs space-y-2.5"
              style={{ backgroundColor: '#FFFFFF', border: '1px solid #D6D5D4' }}
            >
              <div className="text-xs font-extrabold uppercase tracking-wider" style={{ color: '#626262' }}>
                Bauteil hinzufügen
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
                {COMPONENT_CATALOG.map((comp) => (
                  <button
                    key={comp.typ}
                    type="button"
                    onClick={() => handleAddItem(comp)}
                    className="px-3 py-3 rounded-xl text-left font-bold text-xs sm:text-sm flex items-center justify-between gap-1 transition"
                    style={{ backgroundColor: '#F6F5F2', color: '#012F60', border: '1px solid #D6D5D4' }}
                  >
                    <span>{comp.label}</span>
                    <span className="font-black text-base" style={{ color: '#0363FF' }}>+</span>
                  </button>
                ))}
              </div>
            </section>

            {selectedItem && (
              <section
                className="rounded-2xl p-4 shadow-sm space-y-3"
                style={{ backgroundColor: '#FFFFFF', border: '2px solid #0363FF' }}
              >
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex flex-wrap items-center gap-2">
                    <span
                      className="px-2.5 py-1 rounded-lg font-extrabold text-xs"
                      style={{ backgroundColor: '#012F60', color: '#FFFFFF' }}
                    >
                      {selectedItem.typ}
                    </span>
                    {selectedDirInfo && (
                      <span className="text-xs" style={{ color: '#626262' }}>
                        Richtung: {DIR_VECTORS[selectedDirInfo.inDir]?.label}
                        {selectedItem.typ === '90°-Bogen'
                          ? ` → ${DIR_VECTORS[resolveBendOutDir(selectedDirInfo.inDir, selectedItem.bendDir)]?.label}`
                          : ''}
                      </span>
                    )}
                    {selectedItem.typ === 'Stahlrohr' && (
                      <button
                        type="button"
                        onClick={() =>
                          handleUpdateItem(selectedItem.id, { hasNozzle: !selectedItem.hasNozzle })
                        }
                        className="px-3 py-1 rounded-lg text-xs font-extrabold transition"
                        style={
                          selectedItem.hasNozzle
                            ? { backgroundColor: '#D3F622', color: '#012F60', border: '1px solid #012F60' }
                            : { backgroundColor: '#EFEEEC', color: '#012F60', border: '1px solid #BDBCBA' }
                        }
                      >
                        {selectedItem.hasNozzle ? '✓ Stutzen aktiv' : 'Stutzen'}
                      </button>
                    )}
                  </div>

                  <button
                    type="button"
                    onClick={() => handleRemoveItem(selectedItem.id)}
                    className="px-3 py-1.5 rounded-lg font-bold text-xs transition"
                    style={{ backgroundColor: '#FF4C4C', color: '#FFFFFF' }}
                  >
                    Löschen
                  </button>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div>
                    <label className="block text-[11px] font-bold mb-1" style={{ color: '#626262' }}>
                      {selectedItem.typ === 'Reduzierung' ? 'Eingang (DN)' : 'Nennweite (DN)'}
                    </label>
                    <select
                      value={selectedItem.dnIn}
                      onChange={(e) => {
                        const val = Number(e.target.value);
                        handleUpdateItem(selectedItem.id, {
                          dnIn: val,
                          dnOut: selectedItem.typ === 'Reduzierung' ? selectedItem.dnOut : val
                        });
                      }}
                      className="w-full px-3 py-2 rounded-xl bg-white text-sm font-bold"
                      style={{ border: '1px solid #BDBCBA', color: '#012F60' }}
                    >
                      {DN_OPTIONS.map((dn) => (
                        <option key={dn} value={dn}>DN {dn}</option>
                      ))}
                    </select>
                  </div>

                  {selectedItem.typ === 'Reduzierung' && (
                    <div>
                      <label className="block text-[11px] font-bold mb-1" style={{ color: '#626262' }}>
                        Ausgang (DN)
                      </label>
                      <select
                        value={selectedItem.dnOut}
                        onChange={(e) =>
                          handleUpdateItem(selectedItem.id, { dnOut: Number(e.target.value) })
                        }
                        className="w-full px-3 py-2 rounded-xl bg-white text-sm font-bold"
                        style={{ border: '1px solid #BDBCBA', color: '#012F60' }}
                      >
                        {DN_OPTIONS.map((dn) => (
                          <option key={dn} value={dn}>DN {dn}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  <div>
                    <label className="block text-[11px] font-bold mb-1" style={{ color: '#626262' }}>
                      Druckstufe (PN)
                    </label>
                    <select
                      value={selectedItem.pn}
                      onChange={(e) =>
                        handleUpdateItem(selectedItem.id, { pn: Number(e.target.value) })
                      }
                      className="w-full px-3 py-2 rounded-xl bg-white text-sm font-bold"
                      style={{ border: '1px solid #BDBCBA', color: '#012F60' }}
                    >
                      <option value={10}>PN 10</option>
                      <option value={16}>PN 16</option>
                    </select>
                  </div>

                  {selectedItem.inChain && (
                    <div>
                      <label className="block text-[11px] font-bold mb-1" style={{ color: '#626262' }}>
                        Länge / Maß (mm)
                      </label>
                      <input
                        type="number"
                        inputMode="numeric"
                        value={selectedItem.length}
                        onChange={(e) =>
                          handleUpdateItem(selectedItem.id, {
                            length: e.target.value.replace(/\D+/g, '')
                          })
                        }
                        className="w-full px-3 py-2 rounded-xl bg-white text-sm font-mono font-bold"
                        style={{ border: '1px solid #BDBCBA', color: '#012F60' }}
                      />
                    </div>
                  )}

                  {selectedItem.typ === '90°-Bogen' && selectedDirInfo && (
                    <div>
                      <label className="block text-[11px] font-bold mb-1" style={{ color: '#626262' }}>
                        Bogenrichtung
                      </label>
                      <select
                        value={resolveBendOutDir(selectedDirInfo.inDir, selectedItem.bendDir)}
                        onChange={(e) =>
                          handleUpdateItem(selectedItem.id, { bendDir: e.target.value })
                        }
                        className="w-full px-3 py-2 rounded-xl bg-white text-sm font-bold"
                        style={{ border: '1px solid #BDBCBA', color: '#012F60' }}
                      >
                        {getAvailableBendDirections(selectedDirInfo.inDir).map((opt) => (
                          <option key={opt.value} value={opt.value}>{opt.label}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  {selectedItem.typ === 'Stahlrohr' && selectedItem.hasNozzle && (
                    <div>
                      <label className="block text-[11px] font-bold mb-1" style={{ color: '#626262' }}>
                        Stutzengröße
                      </label>
                      <select
                        value={selectedItem.nozzleSize || '1"'}
                        onChange={(e) =>
                          handleUpdateItem(selectedItem.id, { nozzleSize: e.target.value })
                        }
                        className="w-full px-3 py-2 rounded-xl bg-white text-sm font-bold"
                        style={{ border: '1px solid #BDBCBA', color: '#012F60' }}
                      >
                        {NOZZLE_SIZES.map((size) => (
                          <option key={size} value={size}>{size}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  {selectedItem.typ === 'Zähler' && (
                    <>
                      <div>
                        <label className="block text-[11px] font-bold mb-1" style={{ color: '#626262' }}>
                          Zählergröße
                        </label>
                        <select
                          value={selectedItem.gSize || 'G100'}
                          onChange={(e) =>
                            handleUpdateItem(selectedItem.id, { gSize: e.target.value })
                          }
                          className="w-full px-3 py-2 rounded-xl bg-white text-sm font-bold"
                          style={{ border: '1px solid #BDBCBA', color: '#012F60' }}
                        >
                          {G_SIZE_OPTIONS.map((g) => (
                            <option key={g} value={g}>{g}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold mb-1" style={{ color: '#626262' }}>
                          Zählertyp
                        </label>
                        <select
                          value={selectedItem.meterModel || 'Elster DKZ'}
                          onChange={(e) =>
                            handleUpdateItem(selectedItem.id, { meterModel: e.target.value })
                          }
                          className="w-full px-3 py-2 rounded-xl bg-white text-sm font-bold"
                          style={{ border: '1px solid #BDBCBA', color: '#012F60' }}
                        >
                          {METER_MODELS.map((m) => (
                            <option key={m} value={m}>{m}</option>
                          ))}
                        </select>
                      </div>
                      {selectedItem.meterModel === 'Sonstiges' && (
                        <div>
                          <label className="block text-[11px] font-bold mb-1" style={{ color: '#626262' }}>
                            Zählertyp (Freitext)
                          </label>
                          <input
                            type="text"
                            value={selectedItem.customMeterModel || ''}
                            onChange={(e) =>
                              handleUpdateItem(selectedItem.id, { customMeterModel: e.target.value })
                            }
                            placeholder="Zählertyp eingeben..."
                            className="w-full px-3 py-2 rounded-xl bg-white text-sm font-bold"
                            style={{ border: '1px solid #0363FF', color: '#012F60' }}
                          />
                        </div>
                      )}
                    </>
                  )}
                </div>
              </section>
            )}

            {items.length > 0 && (
              <section
                className="rounded-2xl p-3.5 sm:p-4 shadow-xs space-y-2"
                style={{ backgroundColor: '#FFFFFF', border: '1px solid #D6D5D4' }}
              >
                <div className="text-xs font-extrabold uppercase tracking-wider" style={{ color: '#626262' }}>
                  Reihenfolge der Bauteile
                </div>
                <div className="divide-y" style={{ borderColor: '#EFEEEC' }}>
                  {items.map((it, idx) => (
                    <div
                      key={it.id}
                      onClick={() => setSelectedId(it.id)}
                      className="py-2.5 px-2 flex items-center justify-between gap-2 rounded-lg cursor-pointer"
                      style={
                        it.id === selectedId
                          ? { backgroundColor: '#F6F5F2', borderLeft: '3px solid #0363FF' }
                          : undefined
                      }
                    >
                      <div className="text-xs sm:text-sm font-bold" style={{ color: '#012F60' }}>
                        <span className="mr-2" style={{ color: '#8A8988' }}>{idx + 1}.</span>
                        {it.typ}{' '}
                        <span className="font-normal" style={{ color: '#626262' }}>
                          {it.typ === 'Reduzierung' ? `DN ${it.dnIn}/${it.dnOut}` : `DN ${it.dnIn}`}
                        </span>
                        {it.typ === 'Stahlrohr' && it.hasNozzle && (
                          <span className="ml-2 text-xs font-bold" style={{ color: '#0363FF' }}>
                            [Stutzen {it.nozzleSize || '1"'}]
                          </span>
                        )}
                        {it.inChain && (
                          <span className="ml-2 font-mono" style={{ color: '#FF4C4C' }}>
                            {it.length || 0} mm
                          </span>
                        )}
                      </div>

                      <div className="flex items-center gap-1" onClick={(e) => e.stopPropagation()}>
                        <button
                          type="button"
                          onClick={() => handleMoveItem(idx, -1)}
                          disabled={idx === 0}
                          className="px-2 py-1 rounded text-xs disabled:opacity-30"
                          style={{ border: '1px solid #D6D5D4', color: '#012F60' }}
                        >
                          ↑
                        </button>
                        <button
                          type="button"
                          onClick={() => handleMoveItem(idx, 1)}
                          disabled={idx === items.length - 1}
                          className="px-2 py-1 rounded text-xs disabled:opacity-30"
                          style={{ border: '1px solid #D6D5D4', color: '#012F60' }}
                        >
                          ↓
                        </button>
                        <button
                          type="button"
                          onClick={() => handleRemoveItem(it.id)}
                          className="px-2 py-1 rounded text-xs font-bold"
                          style={{ border: '1px solid #FF4C4C', color: '#FF4C4C' }}
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
