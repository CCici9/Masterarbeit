<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zähler-Skizzen-Baukasten</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo } = React;

    // ============================================================================
    // Exakte Nennweiten- & Komponentendefinitionen
    // ============================================================================
    const DN_OPTIONS = [25, 50, 80, 100, 125, 150, 200, 250, 400];
    const G_SIZE_OPTIONS = ['G65', 'G100', 'G160', 'G250', 'G400', 'G650'];
    const METER_MODELS = ['Elster DKZ', 'Rabo', 'IRM-3 Duo'];

    const COMPONENT_CATALOG = [
      { typ: 'Absperrarmatur', label: 'Armatur', defaultLen: 0, inChain: false },
      { typ: 'Reduzierung', label: 'Reduzierung', defaultLen: 150, inChain: true },
      { typ: 'Kompensator', label: 'Kompensator', defaultLen: 150, inChain: true },
      { typ: 'Gaszähler', label: 'Zähler', defaultLen: 171, inChain: true },
      { typ: '90°-Bogen', label: '90°-Bogen', defaultLen: 200, inChain: true },
      { typ: 'Passstück', label: 'Passstück', defaultLen: 200, inChain: true }
    ];

    const DIR_VECTORS = {
      right: { dx: 1, dy: 0, label: 'Horizontal' },
      left: { dx: -1, dy: 0, label: 'Horizontal (←)' },
      up: { dx: 0, dy: -1, label: 'Vertikal (↑)' },
      down: { dx: 0, dy: 1, label: 'Vertikal (↓)' }
    };

    function getAvailableBendDirections(incomingDir) {
      if (incomingDir === 'right' || incomingDir === 'left') {
        return [
          { value: 'up', label: 'Nach oben (↑)' },
          { value: 'down', label: 'Nach unten (↓)' }
        ];
      }
      return [
        { value: 'right', label: 'Nach rechts (→)' },
        { value: 'left', label: 'Nach links (←)' }
      ];
    }

    function resolveBendOutDir(incomingDir, bendDir) {
      const valid = getAvailableBendDirections(incomingDir).map((d) => d.value);
      if (valid.includes(bendDir)) return bendDir;
      return valid[0];
    }

    function getPipeHalfHeight(dn) {
      const idx = DN_OPTIONS.indexOf(Number(dn));
      if (idx === -1) return 18;
      return 13 + idx * 2.5;
    }

    // ============================================================================
    // 2D-Pfad- & Bounding-Box-Berechnung für alle Bauteile
    // ============================================================================
    function compute2DLayout(items, startDir) {
      const STEP_LEN = 144;
      const BEND_ARM = 72;

      let curX = 0;
      let curY = 0;
      let curDir = startDir;

      const nodes = items.map((item, idx) => {
        const inDir = curDir;
        const inVec = DIR_VECTORS[inDir];

        if (item.typ === '90°-Bogen') {
          const outDir = resolveBendOutDir(inDir, item.bendDir);
          const outVec = DIR_VECTORS[outDir];

          const pIn = { x: curX, y: curY };
          const pCorner = {
            x: curX + inVec.dx * BEND_ARM,
            y: curY + inVec.dy * BEND_ARM
          };
          const pOut = {
            x: pCorner.x + outVec.dx * BEND_ARM,
            y: pCorner.y + outVec.dy * BEND_ARM
          };

          curX = pOut.x;
          curY = pOut.y;
          curDir = outDir;

          return {
            item,
            idx,
            isBend: true,
            inDir,
            outDir,
            pIn,
            pCorner,
            pOut,
            center: pCorner
          };
        } else {
          const pIn = { x: curX, y: curY };
          const pOut = {
            x: curX + inVec.dx * STEP_LEN,
            y: curY + inVec.dy * STEP_LEN
          };
          const center = {
            x: (pIn.x + pOut.x) / 2,
            y: (pIn.y + pOut.y) / 2
          };

          curX = pOut.x;
          curY = pOut.y;

          return {
            item,
            idx,
            isBend: false,
            inDir,
            outDir: inDir,
            pIn,
            pOut,
            center
          };
        }
      });

      let minX = -90;
      let maxX = 90;
      let minY = -90;
      let maxY = 90;

      if (nodes.length > 0) {
        minX = Infinity;
        maxX = -Infinity;
        minY = Infinity;
        maxY = -Infinity;

        nodes.forEach((n) => {
          const pts = n.isBend ? [n.pIn, n.pCorner, n.pOut] : [n.pIn, n.pOut];
          pts.forEach((pt) => {
            minX = Math.min(minX, pt.x - 125);
            maxX = Math.max(maxX, pt.x + 135);
            minY = Math.min(minY, pt.y - 105);
            maxY = Math.max(maxY, pt.y + 105);
          });
        });
      }

      return {
        nodes,
        startPoint: { x: 0, y: 0, dir: startDir },
        endPoint: { x: curX, y: curY, dir: curDir },
        bounds: { minX, maxX, minY, maxY }
      };
    }

    // ============================================================================
    // 2D-Bauteil-Renderer
    // ============================================================================
    function SchematicNode({ node, isSelected, onSelect }) {
      const { item, isBend, inDir, outDir, pIn, pCorner, pOut, center } = node;
      const h1 = getPipeHalfHeight(item.dnIn);
      const h2 = getPipeHalfHeight(item.dnOut);
      const isLoose = item.tag === 'Loser Flansch';

      if (isBend) {
        const inVec = DIR_VECTORS[inDir];
        const outVec = DIR_VECTORS[outDir];
        const angleIn = inDir === 'right' ? 0 : inDir === 'down' ? 90 : inDir === 'left' ? 180 : -90;
        const angleOut = outDir === 'right' ? 0 : outDir === 'down' ? 90 : outDir === 'left' ? 180 : -90;

        const nIn = { x: -inVec.dy, y: inVec.dx };
        const nOut = { x: -outVec.dy, y: outVec.dx };
        const dot = nIn.x * outVec.dx + nIn.y * outVec.dy;
        const sign = dot >= 0 ? 1 : -1;

        const p1A = { x: pIn.x + nIn.x * h1 * sign, y: pIn.y + nIn.y * h1 * sign };
        const p1B = { x: pIn.x - nIn.x * h1 * sign, y: pIn.y - nIn.y * h1 * sign };
        const p2A = { x: pOut.x + nOut.x * h1 * sign, y: pOut.y + nOut.y * h1 * sign };
        const p2B = { x: pOut.x - nOut.x * h1 * sign, y: pOut.y - nOut.y * h1 * sign };

        const cA = {
          x: pCorner.x + (nIn.x * sign + nOut.x * sign) * h1 * 0.55,
          y: pCorner.y + (nIn.y * sign + nOut.y * sign) * h1 * 0.55
        };
        const cB = {
          x: pCorner.x - (nIn.x * sign + nOut.x * sign) * h1 * 0.55,
          y: pCorner.y - (nIn.y * sign + nOut.y * sign) * h1 * 0.55
        };

        const labelOffsetX = (-inVec.dx - outVec.dx) * 38;
        const labelOffsetY = (-inVec.dy - outVec.dy) * 38;

        return (
          <g onClick={onSelect} className="cursor-pointer">
            {isSelected && (
              <circle
                cx={pCorner.x}
                cy={pCorner.y}
                r={62}
                fill="rgba(245, 158, 11, 0.16)"
                stroke="#d97706"
                strokeWidth={2.5}
                strokeDasharray="6 3"
              />
            )}

            <path
              d={`M ${p1A.x} ${p1A.y} Q ${cA.x} ${cA.y} ${p2A.x} ${p2A.y} L ${p2B.x} ${p2B.y} Q ${cB.x} ${cB.y} ${p1B.x} ${p1B.y} Z`}
              fill="#f8fafc"
              stroke="#0f172a"
              strokeWidth={2}
            />

            <path
              d={`M ${pIn.x} ${pIn.y} Q ${pCorner.x} ${pCorner.y} ${pOut.x} ${pOut.y}`}
              fill="none"
              stroke="#64748b"
              strokeWidth={1.2}
              strokeDasharray="4 3"
            />

            <g transform={`translate(${pIn.x}, ${pIn.y}) rotate(${angleIn})`}>
              <rect
                x={0}
                y={-h1 - 10}
                width={7}
                height={(h1 + 10) * 2}
                fill={isLoose ? '#dbeafe' : '#e2e8f0'}
                stroke="#0f172a"
                strokeWidth={1.8}
              />
            </g>

            <g transform={`translate(${pOut.x}, ${pOut.y}) rotate(${angleOut})`}>
              <rect
                x={-7}
                y={-h1 - 10}
                width={7}
                height={(h1 + 10) * 2}
                fill={isLoose ? '#dbeafe' : '#e2e8f0'}
                stroke="#0f172a"
                strokeWidth={1.8}
              />
            </g>

            <g transform={`translate(${pCorner.x + labelOffsetX}, ${pCorner.y + labelOffsetY})`}>
              <rect x={-64} y={-22} width={128} height={42} rx={6} fill="#ffffff" stroke="#94a3b8" strokeWidth={1.4} />
              <text x={0} y={-5} fontSize={11.5} fontWeight="bold" fill="#0f172a" textAnchor="middle">
                90°-Bogen DN{item.dnIn}
              </text>
              {item.inChain && (
                <text x={0} y={13} fontSize={12} fontWeight="bold" fill="#b45309" textAnchor="middle">
                  {item.length} mm
                </text>
              )}
            </g>
          </g>
        );
      }

      const isVerticalSeg = inDir === 'up' || inDir === 'down';
      const angle = inDir === 'right' ? 0 : inDir === 'down' ? 90 : inDir === 'left' ? 180 : -90;
      const w = 144;
      const halfW = w / 2;

      const dimOffset = isVerticalSeg ? 74 : 68;
      const labelOffset = isVerticalSeg ? -62 : -56;

      return (
        <g onClick={onSelect} className="cursor-pointer">
          <g transform={`translate(${center.x}, ${center.y}) rotate(${angle})`}>
            {isSelected && (
              <rect
                x={-halfW + 2}
                y={-48}
                width={w - 4}
                height={96}
                rx={8}
                fill="rgba(245, 158, 11, 0.16)"
                stroke="#d97706"
                strokeWidth={2.5}
                strokeDasharray="6 3"
              />
            )}

            <rect
              x={-halfW}
              y={-h1 - 10}
              width={7}
              height={(h1 + 10) * 2}
              fill={isLoose ? '#dbeafe' : '#e2e8f0'}
              stroke="#0f172a"
              strokeWidth={1.8}
            />

            <rect
              x={halfW - 7}
              y={-h2 - 10}
              width={7}
              height={(h2 + 10) * 2}
              fill={isLoose ? '#dbeafe' : '#e2e8f0'}
              stroke="#0f172a"
              strokeWidth={1.8}
            />

            {item.typ === 'Absperrarmatur' && (
              <g>
                <polygon
                  points={`${-halfW + 9},-22 0,0 ${-halfW + 9},22`}
                  fill="#f1f5f9"
                  stroke="#0f172a"
                  strokeWidth={2}
                />
                <polygon
                  points={`${halfW - 9},-22 0,0 ${halfW - 9},22`}
                  fill="#f1f5f9"
                  stroke="#0f172a"
                  strokeWidth={2}
                />
                <circle cx={0} cy={0} r={8} fill="#ffffff" stroke="#0f172a" strokeWidth={2} />
              </g>
            )}

            {item.typ === 'Reduzierung' && (
              <polygon
                points={`${-halfW + 7},${-h1} ${halfW - 7},${-h2} ${halfW - 7},${h2} ${-halfW + 7},${h1}`}
                fill="#f8fafc"
                stroke="#0f172a"
                strokeWidth={2}
              />
            )}

            {item.typ === 'Kompensator' && (
              <g>
                <rect
                  x={-halfW + 8}
                  y={-h1}
                  width={w - 16}
                  height={h1 * 2}
                  fill="#fefce8"
                  stroke="#0f172a"
                  strokeWidth={1.8}
                />
                {[-38, -19, 0, 19, 38].map((wx) => (
                  <line
                    key={wx}
                    x1={wx}
                    y1={-h1 - 7}
                    x2={wx}
                    y2={h1 + 7}
                    stroke="#92400e"
                    strokeWidth={2.5}
                  />
                ))}
              </g>
            )}

            {item.typ === 'Gaszähler' && (
              <rect
                x={-halfW + 10}
                y={-34}
                width={w - 20}
                height={68}
                rx={6}
                fill="#eff6ff"
                stroke="#1d4ed8"
                strokeWidth={2.4}
              />
            )}

            {item.typ === 'Passstück' && (
              <rect
                x={-halfW + 7}
                y={-h1}
                width={w - 14}
                height={h1 * 2}
                fill="#f8fafc"
                stroke="#0f172a"
                strokeWidth={2}
              />
            )}
          </g>

          {item.typ === 'Gaszähler' ? (
            <g transform={`translate(${center.x}, ${center.y})`}>
              <text x={0} y={-11} fontSize={11} fontWeight="bold" fill="#1e3a8a" textAnchor="middle">
                {item.meterModel || 'Zähler'}
              </text>
              <text x={0} y={6} fontSize={14} fontWeight="bold" fill="#0f172a" textAnchor="middle">
                {item.gSize || 'G100'}
              </text>
              <text x={0} y={22} fontSize={11} fontWeight="bold" fill="#334155" textAnchor="middle">
                DN {item.dnIn} • PN{item.pn}
              </text>
            </g>
          ) : (
            <g
              transform={
                isVerticalSeg
                  ? `translate(${center.x + labelOffset}, ${center.y})`
                  : `translate(${center.x}, ${center.y + labelOffset})`
              }
            >
              <text
                x={0}
                y={0}
                fontSize={12}
                fontWeight="bold"
                fill="#0f172a"
                textAnchor={isVerticalSeg ? 'end' : 'middle'}
              >
                {item.typ === 'Reduzierung'
                  ? `Red. ${item.dnIn}/${item.dnOut} (PN${item.pn})`
                  : `${item.typ === 'Absperrarmatur' ? 'Armatur' : item.typ} DN${item.dnIn} (PN${item.pn})`}
              </text>
              {item.tag && (
                <text
                  x={0}
                  y={15}
                  fontSize={10.5}
                  fontWeight="bold"
                  fill="#b45309"
                  textAnchor={isVerticalSeg ? 'end' : 'middle'}
                >
                  [{item.tag}]
                </text>
              )}
            </g>
          )}

          {item.inChain && !isVerticalSeg && (
            <g>
              <line
                x1={pIn.x}
                y1={center.y + 38}
                x2={pIn.x}
                y2={center.y + dimOffset + 6}
                stroke="#64748b"
                strokeWidth={1.4}
              />
              <line
                x1={pOut.x}
                y1={center.y + 38}
                x2={pOut.x}
                y2={center.y + dimOffset + 6}
                stroke="#64748b"
                strokeWidth={1.4}
              />
              <line
                x1={Math.min(pIn.x, pOut.x) + 3}
                y1={center.y + dimOffset}
                x2={Math.max(pIn.x, pOut.x) - 3}
                y2={center.y + dimOffset}
                stroke="#0f172a"
                strokeWidth={1.6}
                markerStart="url(#arrowStart)"
                markerEnd="url(#arrowEnd)"
              />
              <text
                x={center.x}
                y={center.y + dimOffset - 8}
                fontSize={13.5}
                fontWeight="bold"
                fill="#0f172a"
                textAnchor="middle"
              >
                {item.length} mm
              </text>
            </g>
          )}

          {item.inChain && isVerticalSeg && (
            <g>
              <line
                x1={center.x + 38}
                y1={pIn.y}
                x2={center.x + dimOffset + 6}
                y2={pIn.y}
                stroke="#64748b"
                strokeWidth={1.4}
              />
              <line
                x1={center.x + 38}
                y1={pOut.y}
                x2={center.x + dimOffset + 6}
                y2={pOut.y}
                stroke="#64748b"
                strokeWidth={1.4}
              />
              <line
                x1={center.x + dimOffset}
                y1={Math.min(pIn.y, pOut.y) + 3}
                x2={center.x + dimOffset}
                y2={Math.max(pIn.y, pOut.y) - 3}
                stroke="#0f172a"
                strokeWidth={1.6}
                markerStart="url(#arrowStart)"
                markerEnd="url(#arrowEnd)"
              />
              <text
                x={center.x + dimOffset + 9}
                y={center.y + 5}
                fontSize={13.5}
                fontWeight="bold"
                fill="#0f172a"
                textAnchor="start"
              >
                {item.length} mm
              </text>
            </g>
          )}
        </g>
      );
    }

    // ============================================================================
    // Live-2D-Zeichenfläche
    // ============================================================================
    function Live2DSchematicCanvas({
      svgRef,
      positionNumber,
      startDir,
      dichtflaeche,
      items,
      totalLength,
      selectedId,
      onSelect,
      zoomLevel
    }) {
      const layout = useMemo(() => compute2DLayout(items, startDir), [items, startDir]);
      const { nodes, startPoint, endPoint, bounds } = layout;

      const headerSpace = 80;
      const contentW = Math.max(460, bounds.maxX - bounds.minX + 44);
      const contentH = Math.max(250, bounds.maxY - bounds.minY + 36);
      const svgW = contentW;
      const svgH = contentH + headerSpace;

      const offsetX = (svgW - (bounds.maxX - bounds.minX)) / 2 - bounds.minX;
      const offsetY = headerSpace + (contentH - (bounds.maxY - bounds.minY)) / 2 - bounds.minY;

      const startVec = DIR_VECTORS[startPoint.dir];
      const endVec = DIR_VECTORS[endPoint.dir];
      const isZoomed = zoomLevel > 1;

      return (
        <div
          className={`w-full bg-white border-2 border-slate-300 rounded-2xl shadow-sm ${
            isZoomed ? 'overflow-auto max-h-[62vh]' : 'overflow-hidden'
          }`}
        >
          <svg
            ref={svgRef}
            xmlns="http://www.w3.org/2000/svg"
            viewBox={`0 0 ${svgW} ${svgH}`}
            preserveAspectRatio="xMidYMid meet"
            style={{
              fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
              width: isZoomed ? `${Math.round(zoomLevel * 100)}%` : '100%'
            }}
            className={`h-auto block select-none ${
              isZoomed ? 'max-w-none' : 'w-full max-h-[55vh] sm:max-h-[490px]'
            }`}
          >
            <defs>
              <pattern id="techGrid2D" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" strokeWidth="1" />
              </pattern>
              <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
                <path d="M 8 1 L 1 4 L 8 7 Z" fill="#0f172a" />
              </marker>
              <marker id="arrowEnd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 1 1 L 7 4 L 1 7 Z" fill="#0f172a" />
              </marker>
              <marker id="flowHead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
                <path d="M 1 1 L 8 4.5 L 1 8 Z" fill="#0284c7" />
              </marker>
            </defs>

            <rect width={svgW} height={svgH} fill="#ffffff" />
            <rect width={svgW} height={svgH} fill="url(#techGrid2D)" />

            <g transform="translate(14, 12)">
              <rect width={Math.min(430, svgW - 28)} height="52" rx="6" fill="#0f172a" />
              <text x="12" y="23" fontSize="14.5" fontWeight="bold" fill="#fbbf24">
                POS {positionNumber ? positionNumber : '—'} • {DIR_VECTORS[startDir]?.label}
              </text>
              <text x="12" y="42" fontSize="11.5" fill="#e2e8f0">
                {dichtflaeche ? 'Maße von Dichtfläche' : 'Maßbezug: Allgemein'} | Gesamt: {totalLength} mm
              </text>
            </g>

            {nodes.length === 0 ? (
              <g>
                <text
                  x={svgW / 2}
                  y={headerSpace + contentH / 2 - 8}
                  fontSize="15"
                  fontWeight="bold"
                  fill="#475569"
                  textAnchor="middle"
                >
                  Tippe unten auf ein Bauteil, um zu starten
                </text>
                <text
                  x={svgW / 2}
                  y={headerSpace + contentH / 2 + 16}
                  fontSize="12"
                  fill="#94a3b8"
                  textAnchor="middle"
                >
                  Skizze passt sich automatisch an dein Display an
                </text>
              </g>
            ) : (
              <g transform={`translate(${offsetX}, ${offsetY})`}>
                <line
                  x1={startPoint.x - startVec.dx * 44}
                  y1={startPoint.y - startVec.dy * 44}
                  x2={startPoint.x}
                  y2={startPoint.y}
                  stroke="#334155"
                  strokeWidth={3.5}
                />
                <line
                  x1={startPoint.x - startVec.dx * 40}
                  y1={startPoint.y - startVec.dy * 40}
                  x2={startPoint.x - startVec.dx * 12}
                  y2={startPoint.y - startVec.dy * 12}
                  stroke="#0284c7"
                  strokeWidth={3}
                  markerEnd="url(#flowHead)"
                />

                <line
                  x1={endPoint.x}
                  y1={endPoint.y}
                  x2={endPoint.x + endVec.dx * 44}
                  y2={endPoint.y + endVec.dy * 44}
                  stroke="#334155"
                  strokeWidth={3.5}
                />

                {nodes.map((node) => (
                  <SchematicNode
                    key={node.item.id}
                    node={node}
                    isSelected={node.item.id === selectedId}
                    onSelect={() => onSelect(node.item.id)}
                  />
                ))}
              </g>
            )}
          </svg>
        </div>
      );
    }

    // ============================================================================
    // Hauptkomponente: Zähler-Skizzen-Baukasten
    // ============================================================================
    function App() {
      const svgRef = useRef(null);

      const urlContext = useMemo(() => {
        if (typeof window === 'undefined') return { pos: null, source: null };
        const params = new URLSearchParams(window.location.search);
        return {
          pos: params.get('pos'),
          source: params.get('source')
        };
      }, []);

      const [positionNumber, setPositionNumber] = useState('');
      const [startDir, setStartDir] = useState('right');
      const [dichtflaeche, setDichtflaeche] = useState(true);
      const [items, setItems] = useState([]);
      const [selectedId, setSelectedId] = useState(null);
      const [zoomLevel, setZoomLevel] = useState(1);

      useEffect(() => {
        if (urlContext.pos) {
          const digitsOnly = urlContext.pos.replace(/\D+/g, '');
          if (digitsOnly) {
            setPositionNumber(digitsOnly);
          }
        }
      }, [urlContext.pos]);

      const totalLength = useMemo(
        () => items.reduce((sum, it) => (it.inChain ? sum + (Number(it.length) || 0) : sum), 0),
        [items]
      );

      const itemDirections = useMemo(() => {
        let dir = startDir;
        return items.map((it) => {
          const inDir = dir;
          if (it.typ === '90°-Bogen') {
            dir = resolveBendOutDir(inDir, it.bendDir);
          }
          return { id: it.id, inDir, outDir: dir };
        });
      }, [items, startDir]);

      const handleAddItem = (template) => {
        const prev = items[items.length - 1];
        const inheritedDn = prev ? Number(prev.dnOut) : 100;
        const inheritedPn = prev ? Number(prev.pn) : 16;
        const currentOutDir =
          itemDirections.length > 0 ? itemDirections[itemDirections.length - 1].outDir : startDir;

        const defaultBendDir =
          currentOutDir === 'right' || currentOutDir === 'left' ? 'up' : 'right';

        const newId = `el_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`;
        const newItem = {
          id: newId,
          typ: template.typ,
          dnIn: inheritedDn,
          dnOut: inheritedDn,
          pn: inheritedPn,
          length: template.defaultLen,
          gSize: template.typ === 'Gaszähler' ? 'G100' : '',
          meterModel: template.typ === 'Gaszähler' ? 'Elster DKZ' : '',
          bendDir: template.typ === '90°-Bogen' ? defaultBendDir : null,
          tag: '',
          inChain: template.inChain
        };

        setItems((curr) => [...curr, newItem]);
        setSelectedId(newId);
      };

      const handleUpdateItem = (id, patch) => {
        setItems((curr) => curr.map((it) => (it.id === id ? { ...it, ...patch } : it)));
      };

      const handleMoveItem = (index, dir) => {
        const target = index + dir;
        if (target < 0 || target >= items.length) return;
        const copy = [...items];
        const [moved] = copy.splice(index, 1);
        copy.splice(target, 0, moved);
        setItems(copy);
      };

      const handleRemoveItem = (id) => {
        setItems((curr) => {
          const next = curr.filter((it) => it.id !== id);
          if (selectedId === id) {
            setSelectedId(next[next.length - 1]?.id || null);
          }
          return next;
        });
      };

      const handleResetAll = () => {
        setItems([]);
        setSelectedId(null);
        setZoomLevel(1);
      };

      const handleExportPng = () => {
        const svgEl = svgRef.current;
        if (!svgEl) return;

        const serializer = new XMLSerializer();
        const svgString = serializer.serializeToString(svgEl);
        const vb = svgEl.viewBox.baseVal;
        const width = vb && vb.width ? vb.width : 800;
        const height = vb && vb.height ? vb.height : 380;

        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = width * scale;
        canvas.height = height * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        const img = new Image();
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = () => {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);

          const pngUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          const safeNum = positionNumber ? positionNumber.replace(/[^0-9]+/g, '') : 'Unbenannt';
          link.download = `Skizze_POS_${safeNum}.png`;
          link.href = pngUrl;
          link.click();
        };
        img.src = url;
      };

      const selectedItem = items.find((it) => it.id === selectedId) || null;
      const selectedDirInfo = itemDirections.find((d) => d.id === selectedId) || null;

      return (
        <div className="min-h-screen bg-slate-100 text-slate-900 flex flex-col">
          <header className="bg-slate-900 text-white border-b-4 border-amber-500 shadow">
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center font-black shrink-0">
                  ⚙
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-extrabold text-base tracking-tight">Zähler-Skizzen-Baukasten</h1>
                    {urlContext.source && (
                      <span className="px-2 py-0.5 text-[11px] font-bold uppercase bg-amber-500/20 text-amber-300 border border-amber-400/40 rounded">
                        via {urlContext.source}
                      </span>
                    )}
                  </div>
                  <p className="text-[11px] text-slate-400">
                    Bauteile antippen • 90°-Bögen abwinkeln • Skizze als PNG speichern
                  </p>
                </div>
              </div>

              <button
                type="button"
                onClick={handleResetAll}
                className="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-red-950 text-slate-200 hover:text-red-200 border border-slate-700 hover:border-red-700 text-xs font-bold flex items-center gap-1.5 transition"
              >
                ↺ Leeren / Neu starten
              </button>
            </div>

            <div className="bg-slate-800/95 border-t border-slate-700 px-4 py-2.5">
              <div className="max-w-6xl mx-auto flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-2 bg-slate-900 px-3 py-2 rounded-xl border border-slate-700 focus-within:border-amber-500">
                  <span className="text-xs font-black tracking-wide text-slate-400 select-none">POS</span>
                  <input
                    type="text"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    value={positionNumber}
                    onChange={(e) => setPositionNumber(e.target.value.replace(/\D+/g, ''))}
                    className="w-16 bg-transparent font-mono font-extrabold text-sm text-amber-400 focus:outline-none"
                    placeholder="Nr."
                    aria-label="Positionsnummer"
                  />
                </div>

                <div className="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-700">
                  <span className="text-[11px] font-bold text-slate-400 px-2 hidden sm:inline">Lage:</span>
                  {[
                    { id: 'right', label: 'Horizontal' },
                    { id: 'down', label: 'Vertikal (↓)' },
                    { id: 'up', label: 'Vertikal (↑)' }
                  ].map((opt) => (
                    <button
                      key={opt.id}
                      type="button"
                      onClick={() => setStartDir(opt.id)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                        startDir === opt.id
                          ? 'bg-amber-500 text-slate-950 shadow-sm'
                          : 'text-slate-300 hover:text-white'
                      }`}
                    >
                      {opt.label}
                    </button>
                  ))}
                </div>

                <button
                  type="button"
                  onClick={() => setDichtflaeche(!dichtflaeche)}
                  className={`px-3 py-2 rounded-xl text-xs font-bold border flex items-center gap-1.5 transition ${
                    dichtflaeche
                      ? 'bg-emerald-950/80 border-emerald-500 text-emerald-200'
                      : 'bg-slate-900 border-slate-700 text-slate-400'
                  }`}
                >
                  <span>{dichtflaeche ? '✓' : '○'}</span>
                  Maße von Dichtfläche
                </button>

                <div className="ml-auto flex items-center gap-1.5 bg-slate-900 px-3 py-2 rounded-xl border border-slate-700">
                  <span className="text-xs text-slate-400">Gesamt:</span>
                  <span className="font-mono font-extrabold text-sm text-white">{totalLength} mm</span>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-5 space-y-4 sm:space-y-5">
            <section className="space-y-2">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <span className="text-xs font-extrabold uppercase tracking-wider text-slate-600">
                  Live-Skizze ({items.length} {items.length === 1 ? 'Teil' : 'Teile'})
                </span>

                <div className="flex items-center gap-1 bg-white border border-slate-300 rounded-xl p-1 shadow-xs">
                  <button
                    type="button"
                    onClick={() => setZoomLevel((z) => Math.max(1, Number((z - 0.35).toFixed(2))))}
                    disabled={zoomLevel <= 1}
                    className="px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-30"
                    title="Verkleinern"
                  >
                    −
                  </button>
                  <button
                    type="button"
                    onClick={() => setZoomLevel(1)}
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-extrabold transition ${
                      zoomLevel === 1
                        ? 'bg-slate-900 text-amber-400'
                        : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                    }`}
                    title="Auf Bildschirmbreite einpassen"
                  >
                    {Math.round(zoomLevel * 100)}%
                  </button>
                  <button
                    type="button"
                    onClick={() => setZoomLevel((z) => Math.min(2.4, Number((z + 0.35).toFixed(2))))}
                    disabled={zoomLevel >= 2.4}
                    className="px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-30"
                    title="Vergrößern"
                  >
                    +
                  </button>
                </div>
              </div>

              <Live2DSchematicCanvas
                svgRef={svgRef}
                positionNumber={positionNumber}
                startDir={startDir}
                dichtflaeche={dichtflaeche}
                items={items}
                totalLength={totalLength}
                selectedId={selectedId}
                onSelect={setSelectedId}
                zoomLevel={zoomLevel}
              />

              <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                <span className="text-xs text-slate-500">
                  {items.length > 0
                    ? 'Tippe auf ein Bauteil in der Skizze, um es unten zu bearbeiten.'
                    : 'Wähle unten ein Bauteil aus, um deine Skizze aufzubauen.'}
                </span>

                <button
                  type="button"
                  onClick={handleExportPng}
                  disabled={items.length === 0}
                  className="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 disabled:bg-slate-300 disabled:text-slate-500 text-slate-950 font-extrabold text-xs sm:text-sm shadow transition"
                >
                  PNG speichern
                </button>
              </div>
            </section>

            <section className="bg-white border border-slate-200 rounded-2xl p-3.5 sm:p-4 shadow-xs space-y-2.5">
              <div className="text-xs font-extrabold uppercase tracking-wider text-slate-500">
                Bauteil hinzufügen
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
                {COMPONENT_CATALOG.map((comp) => (
                  <button
                    key={comp.typ}
                    type="button"
                    onClick={() => handleAddItem(comp)}
                    className="px-3 py-3 rounded-xl bg-slate-50 hover:bg-amber-50 active:bg-amber-100 border border-slate-200 hover:border-amber-400 text-left font-bold text-xs sm:text-sm text-slate-800 flex items-center justify-between gap-1 transition"
                  >
                    <span>{comp.label}</span>
                    <span className="text-amber-600 font-black text-base">+</span>
                  </button>
                ))}
              </div>
            </section>

            {selectedItem && (
              <section className="bg-white border-2 border-amber-400 rounded-2xl p-4 shadow-sm space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <span className="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 font-extrabold text-xs">
                      {selectedItem.typ}
                    </span>
                    {selectedDirInfo && (
                      <span className="text-xs text-slate-500">
                        Richtung: {DIR_VECTORS[selectedDirInfo.inDir]?.label}
                        {selectedItem.typ === '90°-Bogen'
                          ? ` → ${DIR_VECTORS[resolveBendOutDir(selectedDirInfo.inDir, selectedItem.bendDir)]?.label}`
                          : ''}
                      </span>
                    )}
                  </div>

                  <button
                    type="button"
                    onClick={() => handleRemoveItem(selectedItem.id)}
                    className="px-3 py-1.5 rounded-lg bg-red-50 hover:bg-red-100 text-red-700 font-bold text-xs transition"
                  >
                    Löschen
                  </button>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 mb-1">
                      Nennweite (DN)
                    </label>
                    <select
                      value={selectedItem.dnIn}
                      onChange={(e) => {
                        const val = Number(e.target.value);
                        handleUpdateItem(selectedItem.id, {
                          dnIn: val,
                          dnOut: selectedItem.typ === 'Reduzierung' ? selectedItem.dnOut : val
                        });
                      }}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm font-bold"
                    >
                      {DN_OPTIONS.map((dn) => (
                        <option key={dn} value={dn}>DN {dn}</option>
                      ))}
                    </select>
                  </div>

                  {selectedItem.typ === 'Reduzierung' && (
                    <div>
                      <label className="block text-[11px] font-bold text-slate-500 mb-1">
                        Ausgang (DN)
                      </label>
                      <select
                        value={selectedItem.dnOut}
                        onChange={(e) =>
                          handleUpdateItem(selectedItem.id, { dnOut: Number(e.target.value) })
                        }
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm font-bold"
                      >
                        {DN_OPTIONS.map((dn) => (
                          <option key={dn} value={dn}>DN {dn}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 mb-1">
                      Druckstufe (PN)
                    </label>
                    <select
                      value={selectedItem.pn}
                      onChange={(e) =>
                        handleUpdateItem(selectedItem.id, { pn: Number(e.target.value) })
                      }
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm font-bold"
                    >
                      <option value={10}>PN 10</option>
                      <option value={16}>PN 16</option>
                    </select>
                  </div>

                  {selectedItem.inChain && (
                    <div>
                      <label className="block text-[11px] font-bold text-slate-500 mb-1">
                        Länge / Maß (mm)
                      </label>
                      <input
                        type="number"
                        inputMode="numeric"
                        value={selectedItem.length}
                        onChange={(e) =>
                          handleUpdateItem(selectedItem.id, {
                            length: e.target.value.replace(/\D+/g, '')
                          })
                        }
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm font-mono font-bold"
                      />
                    </div>
                  )}

                  {selectedItem.typ === '90°-Bogen' && selectedDirInfo && (
                    <div>
                      <label className="block text-[11px] font-bold text-slate-500 mb-1">
                        Bogenrichtung
                      </label>
                      <select
                        value={resolveBendOutDir(selectedDirInfo.inDir, selectedItem.bendDir)}
                        onChange={(e) =>
                          handleUpdateItem(selectedItem.id, { bendDir: e.target.value })
                        }
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm font-bold"
                      >
                        {getAvailableBendDirections(selectedDirInfo.inDir).map((opt) => (
                          <option key={opt.value} value={opt.value}>{opt.label}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  {selectedItem.typ === 'Gaszähler' && (
                    <>
                      <div>
                        <label className="block text-[11px] font-bold text-slate-500 mb-1">
                          Zählergröße
                        </label>
                        <select
                          value={selectedItem.gSize || 'G100'}
                          onChange={(e) =>
                            handleUpdateItem(selectedItem.id, { gSize: e.target.value })
                          }
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm font-bold"
                        >
                          {G_SIZE_OPTIONS.map((g) => (
                            <option key={g} value={g}>{g}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold text-slate-500 mb-1">
                          Zählertyp
                        </label>
                        <select
                          value={selectedItem.meterModel || 'Elster DKZ'}
                          onChange={(e) =>
                            handleUpdateItem(selectedItem.id, { meterModel: e.target.value })
                          }
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm font-bold"
                        >
                          {METER_MODELS.map((m) => (
                            <option key={m} value={m}>{m}</option>
                          ))}
                        </select>
                      </div>
                    </>
                  )}
                </div>
              </section>
            )}

            {items.length > 0 && (
              <section className="bg-white border border-slate-200 rounded-2xl p-3.5 sm:p-4 shadow-xs space-y-2">
                <div className="text-xs font-extrabold uppercase tracking-wider text-slate-500">
                  Reihenfolge der Bauteile
                </div>
                <div className="divide-y divide-slate-100">
                  {items.map((it, idx) => (
                    <div
                      key={it.id}
                      onClick={() => setSelectedId(it.id)}
                      className={`py-2.5 px-2 flex items-center justify-between gap-2 rounded-lg cursor-pointer ${
                        it.id === selectedId ? 'bg-amber-50' : 'hover:bg-slate-50'
                      }`}
                    >
                      <div className="text-xs sm:text-sm font-bold text-slate-800">
                        <span className="text-slate-400 mr-2">{idx + 1}.</span>
                        {it.typ} <span className="text-slate-500 font-normal">DN{it.dnIn}</span>
                        {it.inChain && (
                          <span className="ml-2 font-mono text-amber-700">{it.length || 0} mm</span>
                        )}
                      </div>

                      <div className="flex items-center gap-1" onClick={(e) => e.stopPropagation()}>
                        <button
                          type="button"
                          onClick={() => handleMoveItem(idx, -1)}
                          disabled={idx === 0}
                          className="px-2 py-1 rounded border border-slate-200 text-xs disabled:opacity-30"
                        >
                          ↑
                        </button>
                        <button
                          type="button"
                          onClick={() => handleMoveItem(idx, 1)}
                          disabled={idx === items.length - 1}
                          className="px-2 py-1 rounded border border-slate-200 text-xs disabled:opacity-30"
                        >
                          ↓
                        </button>
                        <button
                          type="button"
                          onClick={() => handleRemoveItem(it.id)}
                          className="px-2 py-1 rounded border border-red-200 text-red-600 text-xs"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
